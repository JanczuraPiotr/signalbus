# Skróty w kodowaniu wiadomości tekstowych.
# Na pierwszej pozycji:
#   e - error
#   w - warning
#   i - info
# Na drugiej pozycji źródło informacji:
#   i - input - gdy aplikacja wymienia dane w komunikacji zainicjowanej przez siebie
#   r - request - gdy aplikacja wymienia dane w żądaniu zainicjowanym przez inną aplikację
#   f - file - gdy aplikacja odbiera dane z pliku
#   g - gdy aplikacja wymienia dane z GUI
#   db - baza danych
#   l - napisy do logów.
# Ciągi na pozycji drugiej, dłuższe od 3 znaków dla specyficznych komunikatów klas.
#   _ - znak podkreślenia jako pierwsza nazwa klucza w gałęzi zaczyna podgałąź z komunikatami wspólnymi dla całej gałęzi
#       w której został zdefiniowany. np:
#       e.f._. ...  oznacza wspólne komunikaty dla wszystkich plików,
#       e.f.csv._. ... oznacza wspólne komunikaty dla wszystkich plików csv


