spring.main.banner-mode=off

spring.output.ansi.enabled=always

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
spring.messages.basename=file:./src/main/resources/messages,classpath:messages
spring.messages.cache-duration=0

spring.thymeleaf.prefix=file:./src/main/resources/templates/
spring.thymeleaf.cache=false
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.chain.cache=false

spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.restart.additional-exclude=templates/**,**/message*.properties,content/**
signalbus.content.source-directory=file:./src/main/resources/content/

spring.security.user.name=admin
spring.security.user.password=password

vaadin.productionMode=false
vaadin.copilot.enabled=true
