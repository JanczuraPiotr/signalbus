vaadin.productionMode=false
vaadin.copilot.enabled=true

spring.output.ansi.enabled=always

spring.devtools.restart.enabled=true
spring.messages.basename=file:./src/main/resources/messages,classpath:messages

spring.thymeleaf.prefix=file:./src/main/resources/templates/
spring.thymeleaf.cache=false
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.restart.additional-exclude=templates/**,**/message*.properties

spring.security.user.name=admin
spring.security.user.password=password
