<!DOCTYPE html>
<html
        lang="pl" xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/base.html}"
>
<head>
    <title>[[#{console.creator.pageTitle}]]</title>
    <link rel="stylesheet" th:href="@{/web/css/const.css}"/>
    <link rel="stylesheet" th:href="@{/web/css/apla.css}"/>
    <link rel="stylesheet" th:href="@{/web/css/login.css}"/>
</head>
<body>

<header layout:fragment="header-content">
    <nav>
        <a class="nav-item" th:href="@{/console-creator}">
            <span>[[#{app.navi.console.creator}]]</span>
        </a>
        <a class="nav-item" th:href="@{/}">
            <span>[[#{app.mainPage}]]</span>
        </a>
    </nav>
</header>

<main layout:fragment="main-content">
    <div class="apla">
        <form th:action="@{/console-creator/creator}" method="post">
            <h1>[[#{console.creator.title}]]</h1>

            <p th:if="${error}" class="error-msg" th:text="${error}"></p>

            <label>
                [[#{console.creator.username}]]
                <input
                        type="text" name="username" id="username"
                        th:value="${username != null ? username : uuid}"
                        readonly="readonly" autocomplete="username" required
                >
            </label>

            <label>
                [[#{console.creator.password}]]
                <input
                        type="password" name="password" id="password"
                        autocomplete="new-password" required
                >
            </label>

            <label>
                [[#{console.creator.passwordRepeat}]]
                <input
                        type="password" name="passwordRepeat" id="passwordRepeat"
                        autocomplete="new-password" required
                >
            </label>

            <button type="submit" class="btn btn-default">[[#{console.creator.submit}]]</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function () {
            if (window.PasswordCredential) {
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                if (usernameInput && passwordInput && usernameInput.value && passwordInput.value) {
                    const credential = new PasswordCredential({
                        id: usernameInput.value,
                        password: passwordInput.value,
                        name: 'Konsola ' + usernameInput.value
                    });

                    navigator.credentials.store(credential)
                        .then(() => {
                            console.log('Poświadczenia przekazane do menedżera haseł.');
                        })
                        .catch(err => {
                            console.error('Błąd zapisu poświadczeń:', err);
                        });
                }
            }
        });
    </script>
</main>
</body>
</html>
