vaadin.launch-browser=true
vaadin.url-mapping=/app/*
vaadin.productionMode=true
vaadin.copilot.enabled=false
spring.thymeleaf.prefix=classpath:/templates/
spring.application.name=signalbus
spring.messages.basename=file:./src/main/resources/messages,classpath:messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=-1

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/signalbus}
spring.datasource.username=${DB_USERNAME:signalbus}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.schema=public

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
